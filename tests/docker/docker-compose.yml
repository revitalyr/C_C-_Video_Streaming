# ---------------------------------------------------------------
# Networks
# ---------------------------------------------------------------
networks:
  # "clean" network — unit tests and basic smoke
  clean_net:
    driver: bridge

  # "lossy" network — jitter/loss emulation via tc netem
  # Parameters applied by init-netem.sh script on host
  lossy_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: lossy0

# ---------------------------------------------------------------
# Services
# ---------------------------------------------------------------
services:

  # --- 1. Build (runs once, then cache) --------------
  builder:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
      target: builder
    image: videostreaming-builder:latest
    # build only, do not run
    command: echo "Build complete"

  # --- 2. Unit tests (Catch2) ------------------------------------
  unit-tests:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
      target: test-runner
    image: videostreaming-tests:latest
    depends_on:
      builder:
        condition: service_completed_successfully
    entrypoint: []
    networks:
      - clean_net
      - lossy_net
    cap_add:
      - NET_ADMIN          # needed for tc netem inside container
    environment:
      - TEST_MODE=unit
      - RTP_HOST=rtp-source
      - RTP_PORT=5004
      - RTCP_PORT=5005
    volumes:
      - test-results:/app/results
    command: ["/app/tests/scripts/run_unit.sh"]

  # --- 3. RTP source (ffmpeg) ----------------------------------
  rtp-source:
    image: jrottenberg/ffmpeg:6.1-ubuntu
    networks:
      lossy_net:
        aliases: [rtp-source]
    # test video signal 640x480 30fps, low-latency H.264
    command: >
      -re
      -f lavfi -i testsrc=size=640x480:rate=30
      -f lavfi -i sine=frequency=1000:sample_rate=44100
      -vcodec libx264
      -preset ultrafast
      -tune zerolatency
      -b:v 1000k
      -g 30
      -acodec aac
      -f rtp_mpegts
      rtp://receiver:5004
    restart: on-failure

  # --- 4. Receiver (application under test) ----------------------
  receiver:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
      target: test-runner
    image: videostreaming-tests:latest
    depends_on:
      - rtp-source
    networks:
      lossy_net:
        aliases: [receiver]
    entrypoint: []
    cap_add:
      - NET_ADMIN
    ports:
      - "5004:5004/udp"
      - "5005:5005/udp"
    environment:
      - TEST_MODE=e2e
      - RTP_PORT=5004
      - RTCP_PORT=5005
    volumes:
      - test-results:/app/results
      - pcap-dumps:/app/pcap
    command: ["/app/tests/scripts/run_e2e.sh"]

  # --- 5. RTCP Analyzer (tshark + Python) ----------------------
  analyzer:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
      target: test-runner
    image: docker-analyzer:latest
    depends_on:
      - receiver
    networks:
      - lossy_net
    entrypoint: []
    volumes:
      - pcap-dumps:/app/pcap
      - test-results:/app/results
    command: ["/app/tests/scripts/analyze_rtcp.sh"]

  # --- 6. Stress test: IoT scenarios (weak CPU, low memory) ----
  stress-iot:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
      target: test-runner
    image: videostreaming-tests:latest
    depends_on:
      - rtp-source
    entrypoint: []
    networks:
      - lossy_net
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          cpus: "0.25"       # 25% of one core — typical IoT SoC
          memory: 128M       # 128 MB RAM
    environment:
      - TEST_MODE=stress
      - STRESS_PROFILE=lte_edge
    volumes:
      - test-results:/app/results
    command: ["/app/tests/scripts/run_stress.sh"]
    profiles:
      - stress              # runs only with --profile stress

# ---------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------
volumes:
  test-results:            # JUnit XML + CSV metrics
  pcap-dumps:              # .pcapng for post-mortem analysis
